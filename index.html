<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #121225;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        h1 { color: #ffca28; margin-bottom: 2px; font-size: 24px; text-shadow: 0 0 10px rgba(255,202,40,0.3); }
        p { margin-top: 2px; color: #b0bec5; font-size: 14px; }
        
        .selectors-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto 15px auto;
        }
        .row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        select {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            background: #1c1c3a;
            color: white;
            border: 2px solid #ffca28;
            border-radius: 8px;
            outline: none;
        }
        
        .btn-utility {
            background: #3949ab;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 3px 10px rgba(57, 73, 171, 0.3);
            white-space: nowrap;
        }
        .btn-utility:active { transform: scale(0.95); }

        .spinner-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px auto;
            max-width: 500px;
        }
        .reel-wrapper {
            flex: 1;
            height: 120px;
            border: 4px solid #ffca28;
            border-radius: 12px;
            background: #090914;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 202, 40, 0.2);
        }
        .reel-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 3px;
            background: #00e5ff;
            z-index: 10;
            box-shadow: 0 0 8px #00e5ff;
            transform: translateY(-50%);
        }
        .reel {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            transition: transform 3s cubic-bezier(0.1, 0.8, 0.1, 1);
        }
        .slot-item {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            padding: 0 4px;
            box-sizing: border-box;
            border-bottom: 1px solid #1a1a3a;
            line-height: 1.2;
        }
        
        .btn-main {
            background: #e91e63;
            color: white;
            border: none;
            padding: 15px 45px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
            transition: transform 0.1s;
        }
        .btn-main:active { transform: scale(0.95); }
        
        #error-log {
            color: #ff5252;
            background: #2a1212;
            padding: 10px;
            border-radius: 5px;
            margin: 20px auto;
            max-width: 500px;
            display: none;
            font-size: 12px;
            text-align: left;
        }
    </style>
</head>

const ITEM_HEIGHT = 120; 

function generateReelHTML(items) {
    if(!items || items.length === 0) return '<div class="slot-item">Empty</div>';
    let html = "";
    for (let i = 0; i < 40; i++) {
        let item = items[i % items.length];
        html += `<div class="slot-item">${item}</div>`;
    }
    return html;
}

function randomizeLocation() {
    try {
        const dropdown = document.getElementById("locationSelect");
        const randomIndex = Math.floor(Math.random() * dropdown.options.length);
        dropdown.selectedIndex = randomIndex;
        loadRoundOptions();
    } catch(err) {
        logError("randomizeLocation", err);
    }
}

function loadRoundOptions() {
    try {
        const loc = document.getElementById("locationSelect").value;
        const roundSelect = document.getElementById("roundSelect");
        
        if (loc === "Springs") {
            roundSelect.options[2].text = "Round 3: Entertainment & Spots";
        } else {
            roundSelect.options[2].text = "Round 3: Rides & Action";
        }
        
        buildReels();
    } catch(err) {
        logError("loadRoundOptions", err);
    }
}

function buildReels() {
    try {
        const loc = document.getElementById("locationSelect").value;
        const round = document.getElementById("roundSelect").value;
        
        const locationData = LOCATIONS_DATA[loc][round];
        
        document.getElementById("reel1").innerHTML = generateReelHTML(locationData["c1"]);
        document.getElementById("reel2").innerHTML = generateReelHTML(locationData["c2"]);
        document.getElementById("reel3").innerHTML = generateReelHTML(locationData["c3"]);
        
        document.querySelectorAll('.reel').forEach(r => {
            r.style.transition = 'none';
            r.style.transform = 'translateY(0px)';
        });
    } catch(err) {
        logError("buildReels", err);
    }
}

function spinWheels() {
    try {
        document.querySelectorAll('.reel').forEach((reel) => {
            reel.style.transition = 'transform 3s cubic-bezier(0.1, 0.8, 0.1, 1)';
            const randomIndex = Math.floor(Math.random() * (35 - 20) + 20);
            const targetOffset = -(randomIndex * ITEM_HEIGHT);
            reel.style.transform = `translateY(${targetOffset}px)`;
        });
    } catch(err) {
        logError("spinWheels", err);
    }
}

function logError(action, error) {
    const logBox = document.getElementById("error-log");
    logBox.style.display = "block";
    logBox.innerHTML = `<strong>Error in execution (${action}):</strong> ${error.message}`;
    console.error(error);
}

// Initial deployment setup
window.onload = function() {
    try {
        loadRoundOptions();
    } catch(err) {
        logError("window.onload", err);
    }
};
