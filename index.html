<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDW Randomizer Challenge</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #121225;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        h1 { color: #ffca28; margin-bottom: 2px; font-size: 24px; text-shadow: 0 0 10px rgba(255,202,40,0.3); }
        p { margin-top: 2px; color: #b0bec5; font-size: 14px; }
        
        .selectors-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto 15px auto;
        }
        .row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        select {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            background: #1c1c3a;
            color: white;
            border: 2px solid #ffca28;
            border-radius: 8px;
            outline: none;
        }
        
        /* Utility Buttons */
        .btn-utility {
            background: #3949ab;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 3px 10px rgba(57, 73, 171, 0.3);
            white-space: nowrap;
        }
        .btn-utility:active { transform: scale(0.95); }
        /* Main Action Button */
        .btn-main {
            background: #e91e63;
            color: white;
            border: none;
            padding: 15px 45px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
            transition: transform 0.1s;
        }
        .btn-main:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>WDW RANDOMIZER</h1>
    <p>The Ultimate Location Challenge</p>

    <div class="selectors-container">
        <div class="row">
            <select id="locationSelect" onchange="loadRoundOptions()">
                <option value="MK">Magic Kingdom</option>
                <option value="EP">EPCOT</option>
                <option value="HS">Hollywood Studios</option>
                <option value="AK">Animal Kingdom</option>
                <option value="Resorts">Monorail/Skyliner Resorts</option>
                <option value="Springs">Disney Springs</option>
            </select>
            <button class="btn-utility" onclick="randomizeLocation()">Randomize Location</button>
        </div>

        <div class="row">
            <select id="roundSelect" onchange="buildReels()">
                <option value="Snacks">Round 1: Snacks & Drinks</option>
                <option value="Shopping">Round 2: Shopping</option>
                <option value="Activities">Round 3: Rides & Action</option>
            </select>
        </div>
    </div>

    <div class="spinner-container">
        <div class="reel-wrapper"><div id="reel1" class="reel"></div></div>
        <div class="reel-wrapper"><div id="reel2" class="reel"></div></div>
        <div class="reel-wrapper"><div id="reel3" class="reel"></div></div>
    </div>

    <button class="btn-main" onclick="spinWheels()">SPIN THE WHEELS</button>
